<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Receipt | Paradigm</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <meta name="robots" content="noindex" />
    <script>(function(d){var h=d.documentElement,n=navigator;try{if(localStorage.getItem('paradigm_theme')==='light')h.classList.add('light-mode')}catch(e){}var m=null;try{m=localStorage.getItem('paradigm_perf')}catch(e){}if(m==='lite'||(m!=='full'&&((n.hardwareConcurrency||8)<=4||(n.deviceMemory||8)<=4||(n.connection&&n.connection.saveData))))h.classList.add('perf-lite')})(document);</script>
    <link rel="stylesheet" href="css/tailwind.css" />
    <link rel="stylesheet" href="styles/account.css" />
    <style>
        @layer components {
            .receipt { max-width: 760px; margin: 0 auto; }
            .r-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; border-bottom: 1px solid #222; padding-bottom: 18px; margin-bottom: 18px; }
            .r-brand { font-size: 26px; font-weight: 300; letter-spacing: 10px; text-transform: uppercase; }
            .r-sub { font-family: monospace; font-size: 9px; letter-spacing: 3px; color: #666; text-transform: uppercase; margin-top: 4px; }
            .r-meta { text-align: right; font-family: monospace; font-size: 10px; letter-spacing: 2px; color: #aaa; line-height: 1.9; text-transform: uppercase; }
            .r-meta b { color: #3b82f6; font-weight: normal; font-size: 14px; }
            .r-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
            .r-label { font-family: monospace; font-size: 9px; letter-spacing: 3px; color: #666; text-transform: uppercase; margin-bottom: 6px; }
            .r-text { font-size: 12px; color: #ccc; line-height: 1.7; }
            .r-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 16px; }
            .r-table th { font-family: monospace; font-size: 9px; letter-spacing: 2px; color: #666; text-transform: uppercase; text-align: left; padding: 8px 6px; border-bottom: 1px solid #333; font-weight: normal; }
            .r-table td { padding: 10px 6px; border-bottom: 1px solid #161616; }
            .r-table .num { text-align: right; font-family: monospace; }
            .r-totals { margin-left: auto; width: 280px; font-family: monospace; font-size: 11px; }
            .r-totals div { display: flex; justify-content: space-between; padding: 5px 0; color: #aaa; }
            .r-totals .grand { border-top: 1px solid #333; margin-top: 6px; padding-top: 10px; color: #3b82f6; font-size: 14px; }
            .r-foot { margin-top: 30px; text-align: center; font-family: monospace; font-size: 9px; letter-spacing: 3px; color: #666; text-transform: uppercase; line-height: 1.9; }
            .r-actions { display: flex; gap: 10px; justify-content: center; margin-bottom: 25px; }
            @media (max-width: 600px) { .r-cols { grid-template-columns: 1fr; } .r-head { flex-direction: column; } .r-meta { text-align: left; } .r-totals { width: 100%; } }
            /* Print: plain black on white, no background effects or buttons. */
            @media print {
                body { background: #fff !important; color: #000 !important; }
                body::before, body::after, .r-actions { display: none !important; }
                .panel { background: #fff !important; border: none !important; padding: 0 !important; }
                .r-text, .r-meta, .r-totals div, .r-table td { color: #000 !important; }
                .r-meta b, .r-totals .grand { color: #000 !important; }
                .r-table td, .r-table th, .r-head { border-color: #ccc !important; }
            }
        }
    </style>
    <link rel="stylesheet" href="styles/light.css" />
    <link rel="stylesheet" href="styles/perf.css" />
    <script defer src="pwa.js"></script>
</head>
<body>
    <div class="wrapper pt-10">
        <div class="r-actions">
            <a class="btn btn-auto" href="Orders.html">◄ My Orders</a>
            <button class="btn btn-blue btn-auto" onclick="window.print()">⎙ Print / Save PDF</button>
        </div>
        <div class="panel receipt" id="receipt"><div class="no-matches">Loading receipt...</div></div>
    </div>

    <script type="module">
        import { getOrder } from './auth.js';
        import { escapeHtml, peso } from './ui.js';

        const id = new URLSearchParams(location.search).get('order');
        const box = document.getElementById('receipt');
        const { ok, status, data } = id ? await getOrder(id) : { ok: false, status: 404, data: {} };
        if (status === 401) window.location.href = `Login.html?next=${encodeURIComponent(`Receipt.html?order=${id}`)}`;
        else if (!ok) box.innerHTML = '<div class="no-matches">--- [ RECEIPT NOT FOUND ] ---</div>';
        else {
            const o = data.order;
            const a = o.shippingAddress || {};
            document.title = `Receipt #${o.id} | Paradigm`;
            box.innerHTML = `
                <div class="r-head">
                    <div><div class="r-brand">Paradigm</div><div class="r-sub">Clothing Projects · Official Receipt</div></div>
                    <div class="r-meta">Order <b>#${escapeHtml(o.id)}</b><br>${new Date(o.createdAt).toLocaleString()}<br>Status: ${escapeHtml(o.status)}</div>
                </div>
                <div class="r-cols">
                    <div><div class="r-label">Billed / Shipped To</div>
                        <div class="r-text">${escapeHtml(a.name || o.customerName)}<br>${[a.line1, a.line2].filter(Boolean).map(escapeHtml).join('<br>')}<br>${escapeHtml([a.city, a.province, a.postalCode].filter(Boolean).join(', '))}<br>${escapeHtml(a.country || '')}</div></div>
                    <div><div class="r-label">Contact &amp; Payment</div>
                        <div class="r-text">${escapeHtml(o.customerEmail)}<br>${escapeHtml(o.contactPhone || '—')}<br>Payment: ${o.paymentMethod === 'online' ? 'Online (PayMongo)' : 'Cash on Delivery'} · ${o.paymentStatus === 'paid' ? `PAID${o.paidAt ? ` ${new Date(o.paidAt).toLocaleDateString()}` : ''}` : 'UNPAID'}
                        ${o.trackingNumber ? `<br>${escapeHtml(o.courier || 'Courier')} · ${escapeHtml(o.trackingNumber)}` : ''}</div></div>
                </div>
                <table class="r-table">
                    <thead><tr><th>Item</th><th>Size</th><th class="num">Qty</th><th class="num">Unit</th><th class="num">Amount</th></tr></thead>
                    <tbody>${o.items.map(i => `<tr><td>${escapeHtml(i.title)}${i.color ? ` · ${escapeHtml(i.color)}` : ''}${i.isPreorder ? ' (pre-order)' : ''}</td><td>${escapeHtml(i.size || '—')}</td><td class="num">${i.quantity}</td><td class="num">${peso(i.unitPrice)}</td><td class="num">${peso(i.lineTotal)}</td></tr>`).join('')}</tbody>
                </table>
                <div class="r-totals">
                    <div><span>Subtotal</span><span>${peso(o.subtotal)}</span></div>
                    ${o.bundleDiscount ? `<div><span>Bundle deal</span><span>−${peso(o.bundleDiscount)}</span></div>` : ''}
                    ${o.discount ? `<div><span>Code ${escapeHtml(o.discountCode || '')}</span><span>−${peso(o.discount)}</span></div>` : ''}
                    <div><span>Shipping</span><span>${o.shippingFee ? peso(o.shippingFee) : 'FREE'}</span></div>
                    <div class="grand"><span>Total</span><span>${peso(o.total)}</span></div>
                </div>
                ${o.notes ? `<div class="r-label mt-5">Delivery Notes</div><div class="r-text">${escapeHtml(o.notes)}</div>` : ''}
                <div class="r-foot">Thank you for shopping Paradigm<br>prdgm.vercel.app · Returns &amp; exchanges within 30 days of shipping</div>`;
        }
    </script>
</body>
</html>
