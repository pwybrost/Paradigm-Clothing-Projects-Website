<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Archive | Paradigm</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>if(localStorage.getItem('paradigm_theme') === 'light') document.documentElement.classList.add('light-mode');</script>
    <link rel="stylesheet" href="css/tailwind.css" />
    <link rel="stylesheet" href="styles/menu.css" />
    <style>
        /* Page styles live in the components layer so Tailwind utilities can override them. */
        @layer components {
            /* --- CORE STYLES --- */
            * { box-sizing: border-box; margin: 0; padding: 0; }
            body { min-height: 100vh; display: flex; flex-direction: column; font-family: 'Helvetica Neue', Arial, sans-serif; color: #fff; overflow-x: hidden; background: #000; user-select: none; -webkit-user-select: none; }
            body::before { 
                content: ""; position: fixed; top: -10%; left: -10%; width: 120vw; height: 120vh; 
                background-image: url('https://img.freepik.com/free-photo/grayscale-futuristic-abstract-background-with-light-effects_181624-16494.jpg');
                background-size: cover; background-position: center; z-index: -2;
                animation: glowzoom 12s infinite alternate ease-in-out;
            }
            body::after { content: ""; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); z-index: -1; transition: background 0.5s; }
            @keyframes glowzoom { 0% { transform: scale(1); filter: brightness(0.3) saturate(1) blur(6px); opacity: 0.5; } 100% { transform: scale(1.15); filter: brightness(1.5) saturate(2.5) blur(0px); opacity: 1; } }

            /* --- HEADER & NAVIGATION --- */
            .header-btn { position: fixed; top: 20px; background: rgba(0,0,0,0.6); color: #fff; border: 1px solid rgba(255,255,255,0.3); padding: 12px 20px; font-size: 10px; font-weight: bold; font-family: monospace; letter-spacing: 2px; cursor: pointer; backdrop-filter: blur(5px); z-index: 1000; transition: all 0.3s ease; text-transform: uppercase; }
            .header-btn:hover { background: #fff; color: #000; box-shadow: 0 0 15px rgba(255,255,255,0.8); }
            .btn-left { left: 20px; border-color: #3b82f6; color: #3b82f6; }
            .btn-right { right: 20px; }

            .page-header { padding: 50px 0 20px 0; text-align: center; text-transform: uppercase; }
            .page-header h1 { font-size: 45px; font-weight: 300; letter-spacing: 12px; margin-bottom: 5px; }

            /* --- SEARCH & FILTER SECTION --- */
            .filter-wrapper { max-width: 800px; margin: 0 auto 40px auto; padding: 0 20px; display: flex; flex-direction: column; gap: 10px; }
            .search-input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(59, 130, 246, 0.3); padding: 15px; color: #fff; font-family: monospace; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; outline: none; transition: 0.3s; text-align: center; }
            .search-input:focus { border-color: #3b82f6; background: rgba(59, 130, 246, 0.1); box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }
            .price-filters { display: flex; gap: 10px; justify-content: center; }
            .price-filters input { width: 40%; }

            /* --- PRODUCT GRID --- */
            .wrapper { flex-grow: 1; max-width: 1600px; margin: 0 auto; padding: 0 20px 40px 20px; position: relative; z-index: 10; width: 100%; }
            .product-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; min-height: 200px; }
            .product-card { background: rgba(10,10,10,0.85); border: 1px solid rgba(255,255,255,0.1); padding: 15px; transition: 0.3s; cursor: pointer; }
            .product-card:hover { border-color: rgba(255,255,255,0.5); transform: translateY(-3px); }
            .product-card img { width: 100%; height: 180px; object-fit: cover; margin-bottom: 12px; }
            .product-card h4 { font-size: 10px; letter-spacing: 1px; height: 25px; overflow: hidden; margin-bottom: 5px; }
            .product-card .price { color: #3b82f6; font-family: monospace; margin-bottom: 10px; }

            /* --- NO MATCH STATE --- */
            .no-matches { grid-column: 1 / -1; text-align: center; padding: 100px 0; font-family: monospace; color: #666; letter-spacing: 5px; text-transform: uppercase; }

            /* --- MODALS --- */
            .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 2000; }
            .modal-overlay.active { display: flex; }
            .modal-content { background: #080808; border: 1px solid #333; padding: 40px; width: 100%; max-width: 800px; position: relative; animation: modal-zoom 0.4s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 0 50px rgba(0,0,0,1); }
            @keyframes modal-zoom { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
            .modal-close { position: absolute; top: 20px; right: 20px; color: #666; cursor: pointer; font-family: monospace; font-size: 14px; }
            .modal-close:hover { color: #fff; }

            .product-detail-flex { display: flex; gap: 30px; }
            .detail-info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }

            .btn { background: #000; color: #fff; border: 1px solid rgba(255,255,255,0.3); padding: 12px; cursor: pointer; text-transform: uppercase; font-size: 10px; letter-spacing: 2px; transition: 0.3s; width: 100%; }
            .btn:hover { background: #fff; color: #000; }
            .btn-blue { background: #3b82f6; border-color: #3b82f6; }
            .checkout-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #222; font-size: 11px; }
        
            .qty-btn { background: #333; color: #fff; border: none; padding: 2px 8px; cursor: pointer; font-family: monospace; border-radius: 2px; }
            .qty-btn:hover { background: #555; }
            .remove-btn { background: none; border: 1px solid #ff4d4d; color: #ff4d4d; padding: 2px 6px; cursor: pointer; font-family: monospace; font-size: 10px; margin-left: 10px; }
            .remove-btn:hover { background: #ff4d4d; color: #000; }

            /* --- IMAGE ZOOM MAGNIFIER --- */
            .img-zoom-container { 
                width: 45%; 
                height: 400px; 
                overflow: hidden; 
                position: relative; 
                cursor: zoom-in; 
                border: 1px solid #222; 
            }
            .img-zoom-container img { 
                width: 100%; 
                height: 100%; 
                object-fit: cover; 
                transition: transform 0.15s ease-out; 
                transform-origin: center center; 
            }

            /* --- DISCONNECT BUTTON ANIMATION --- */
            .btn-disconnect { 
                background: rgba(139, 0, 0, 0.1); 
                border: 1px solid #8b0000; 
                color: #ff4d4d; 
                padding: 8px 20px; 
                cursor: pointer; 
                font-size: 10px; 
                font-family: monospace; 
                letter-spacing: 2px; 
                transition: all 0.3s ease; 
                position: relative; 
                overflow: hidden; 
                z-index: 1;
            }
            .btn-disconnect::before { 
                content: ""; 
                position: absolute; 
                top: 0; left: -100%; 
                width: 100%; height: 100%; 
                background: #8b0000; 
                transition: all 0.3s ease; 
                z-index: -1; 
            }
            .btn-disconnect:hover::before { left: 0; }
            .btn-disconnect:hover { 
                color: #fff; 
                box-shadow: 0 0 15px rgba(255, 77, 77, 0.6); 
                border-color: #ff4d4d; 
            }

            /* --- SMOOTH LOADING OVERLAY & ANIMATIONS --- */
            .loader-overlay {
                position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
                background: #000; z-index: 9999; display: flex; flex-direction: column;
                justify-content: center; align-items: center; transition: opacity 0.8s ease;
            }
            .loader-text {
                font-family: monospace; font-size: 14px; color: #3b82f6; letter-spacing: 8px;
                animation: pulse-text 1.5s infinite alternate; text-transform: uppercase;
            }
            @keyframes pulse-text { from { opacity: 0.4; text-shadow: 0 0 0px #3b82f6; } to { opacity: 1; text-shadow: 0 0 15px #3b82f6; } }
        
            /* Utility classes for Javascript to toggle */
            .fade-out { opacity: 0; pointer-events: none; }
            .grid-enter { animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(20px); }
            @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }

            /* --- LIGHT MODE --- */
            html.light-mode body::after { background: rgba(255,255,255,0.7); }
            html.light-mode .modal-content, html.light-mode .product-card { background: #fff; color: #000; border-color: #ccc; }
            html.light-mode .loader-overlay { background: #fff; } /* Match loader to light mode if enabled */
        }
    </style>
</head>
<body>

    <div id="loaderScreen" class="loader-overlay">
        <div class="loader-text">Initializing Archive Data...</div>
    </div>

    <button class="header-btn btn-left" id="checkoutTrigger">Execute Order (0)</button>
    <div class="header-actions" id="headerActions">
        <button class="header-btn btn-right" id="themeToggleBtn">🌓 Theme</button>
    </div>

    <div class="page-header">
        <h1>Paradigm</h1>
        <h3 class="text-[10px] tracking-[5px] text-[#666]">Spring/Summer 2026 Archive</h3>
    </div>

    <div class="filter-wrapper">
        <input type="text" id="archiveSearch" class="search-input" placeholder="Initiate Keyword Search...">
        <div class="price-filters">
            <input type="number" id="minPrice" class="search-input" placeholder="MIN PRICE (₱)">
            <input type="number" id="maxPrice" class="search-input" placeholder="MAX PRICE (₱)">
            <button class="btn btn-blue w-[20%]" onclick="applyFilters()">FILTER</button>
        </div>
    </div>

    <div class="wrapper">
        <main id="product-list" class="product-grid"></main>

        <div class="mt-[60px] p-10 border border-[#222] bg-black/50">
            <div class="flex justify-between items-center">
                <div>
                    <h2 class="text-[12px] tracking-[4px] mb-2.5">AUTHORIZED USER: <span id="dispUser" class="text-accent">...</span></h2>
                    <p class="text-[10px] text-[#666]" id="dispEmail">...</p>
                </div>
                <button id="logoutBtn" class="btn-disconnect">DISCONNECT</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="productModal"><div class="modal-content"><span class="modal-close" onclick="closeModal('productModal')">[ CLOSE ]</span><div id="productDetailContent"></div></div></div>
    
    <div class="modal-overlay" id="checkoutModal">
        <div class="modal-content max-w-[600px]">
            <span class="modal-close" onclick="closeModal('checkoutModal')">[ CLOSE ]</span>
            <h2 class="text-[14px] tracking-[5px] mb-[25px] text-center">MANIFEST</h2>
            <div id="cart-items-list" class="max-h-[300px] overflow-y-auto mb-5 pr-2.5"></div>
            <div class="border-t border-[#333] pt-5">
                <div class="flex justify-between mb-5 font-mono"><span>TOTAL VALUATION:</span> <span class="text-accent">₱<span id="total-price">0.00</span></span></div>
                <button class="btn btn-blue" id="confirmCheckoutBtn" onclick="processCheckout()">Finalize Transmission</button>
                <p id="status-msg" class="text-center text-[10px] mt-[15px] font-mono text-[#888]"></p>
            </div>
        </div>
    </div>

    <script type="module">
        import { getCurrentUser, logout, placeOrder, getWishlist, addToWishlist, removeFromWishlist } from './auth.js';
        import { mountUserMenu, loadCart, saveCart, toast } from './ui.js';

        const PLACEHOLDER_CARD = 'https://placehold.co/400?text=Paradigm';
        const PLACEHOLDER_DETAIL = 'https://placehold.co/800?text=Paradigm';

        // --- AUDIO COOLDOWN ---
        let audioCtx;
        let lastPlayed = 0;
        function playSound() {
            const now = Date.now();
            if (now - lastPlayed < 100) return;
            lastPlayed = now;

            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'square'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        // Product text comes from the database, so escape it before using innerHTML.
        const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => (
            { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
        ));

        // The loader screen stays up while the session is checked with the server.
        const user = await getCurrentUser();
        if (!user) {
            window.location.href = 'Login.html';
        } else {
            document.getElementById('dispUser').textContent = user.username;
            document.getElementById('dispEmail').textContent = user.email;
            mountUserMenu(user, { current: 'archive' });
        }

        let allProducts = [];
        let cart = [];
        let wishlistIds = new Set();
        const isAdmin = user?.role === 'admin';

        async function loadWishlistIds() {
            const { ok, data } = await getWishlist();
            if (ok) wishlistIds = new Set(data.items.map(i => i.id));
        }

        // Restore the saved cart, dropping removed items and refreshing names/prices from the API.
        function restoreCart() {
            cart = loadCart().flatMap(i => {
                const p = allProducts.find(x => x.id === i.id);
                return p ? [{ id: p.id, name: p.title, price: p.price, quantity: Math.min(99, i.quantity) }] : [];
            });
            updateCartUI();
        }

        // --- IMAGE PRELOADER LOGIC ---
        function preloadImages(products) {
            return Promise.all(products.map(p => new Promise((resolve) => {
                const img = new Image();
                img.onload = resolve;
                img.onerror = resolve;
                img.src = p.image || PLACEHOLDER_CARD;
            })));
        }

        // --- PRODUCTS FROM THE PARADIGM API (Neon PostgreSQL) ---
        async function fetchProducts() {
            const res = await fetch('/api/products', { headers: { Accept: 'application/json' } });
            if (!res.ok) throw new Error(`Product API responded with ${res.status}`);
            const data = await res.json();
            if (!Array.isArray(data)) throw new Error('Product API returned an unexpected payload');
            return data;
        }

        async function init() {
            let loadError = null;
            try {
                [allProducts] = await Promise.all([fetchProducts(), loadWishlistIds()]);
                await preloadImages(allProducts);
            } catch (e) {
                console.error('Failed to load the archive from the API.', e);
                loadError = e;
                allProducts = [];
            }

            if (loadError) {
                document.getElementById('product-list').innerHTML = `<div class="no-matches">--- [ ARCHIVE OFFLINE · RETRY LATER ] ---</div>`;
            } else {
                renderGrid(allProducts);
                restoreCart();
            }

            const loader = document.getElementById('loaderScreen');
            if (loader) loader.classList.add('fade-out');

            const grid = document.getElementById('product-list');
            if (grid) grid.classList.add('grid-enter');

            if (loader) setTimeout(() => { loader.style.display = 'none'; }, 800);

            // Owner console: only downloaded for admin accounts. The server checks the role on every admin request.
            if (isAdmin && !loadError) {
                const admin = await import('./admin.js');
                await admin.mount({
                    getProducts: () => allProducts,
                    setProducts: (list) => { allProducts = list; applyFilters(); },
                });
            }

            // Orders.html "View Cart" links here with #cart.
            if (location.hash === '#cart' && !loadError) {
                document.getElementById('checkoutTrigger').click();
                history.replaceState(null, '', location.pathname);
            }
        }

        // --- RENDER GRID ---
        function renderGrid(productsToDisplay) {
            const container = document.getElementById('product-list');
            if (productsToDisplay.length === 0 && !isAdmin) {
                container.innerHTML = `<div class="no-matches">--- [ NO MATCHING DATA FOUND ] ---</div>`;
                return;
            }

            const addCard = isAdmin ? `
                <div class="product-card admin-add-card" onclick="adminCreate()"><span>＋</span><span>Register New Item</span></div>` : '';

            container.innerHTML = addCard + productsToDisplay.map(p => `
                <div class="product-card" onclick="openProduct(${p.id})">
                    ${isAdmin ? `<button class="admin-edit-btn" title="Edit item" onclick="event.stopPropagation(); adminEdit(${p.id})">✎ EDIT</button>` : ''}
                    <button class="wish-btn${wishlistIds.has(p.id) ? ' is-active' : ''}" data-wish="${p.id}" title="Wishlist" onclick="event.stopPropagation(); toggleWishlist(${p.id})">${wishlistIds.has(p.id) ? '♥' : '♡'}</button>
                    <img src="${escapeHtml(p.image || PLACEHOLDER_CARD)}" alt="${escapeHtml(p.title)}" loading="lazy" onerror="this.onerror=null; this.src='${PLACEHOLDER_CARD}'">
                    <h4>${escapeHtml(p.title)}</h4>
                    <p class="price">₱${p.price.toLocaleString()}</p>
                    <button class="btn" onclick="event.stopPropagation(); addToCart(${p.id})">Add to Cart</button>
                </div>
            `).join('');
        }

        // --- NUMERICAL FILTERS ---
        window.applyFilters = () => {
            const query = document.getElementById('archiveSearch').value.toLowerCase().trim();
            const minStr = document.getElementById('minPrice').value;
            const maxStr = document.getElementById('maxPrice').value;

            let min = minStr === "" ? 0 : Math.abs(parseFloat(minStr));
            let max = maxStr === "" ? Infinity : Math.abs(parseFloat(maxStr));

            if (min > max && max !== Infinity) [min, max] = [max, min];

            const filtered = allProducts.filter(p => {
                const matchesSearch = p.title.toLowerCase().includes(query) || p.desc.toLowerCase().includes(query);
                const matchesPrice = p.price >= min && p.price <= max;
                return matchesSearch && matchesPrice;
            });
            renderGrid(filtered);
        };

        document.getElementById('archiveSearch').addEventListener('input', applyFilters);

        // --- PRODUCT DETAIL WITH MAGNIFYING GLASS ---
        window.openProduct = (id) => {
            const p = allProducts.find(x => x.id === id);
            if (!p) return;
            playSound();

            document.getElementById('productDetailContent').innerHTML = `
                <div class="product-detail-flex">
                    <div class="img-zoom-container" onmousemove="zoomImage(event, this)" onmouseleave="resetZoom(this)">
                        <img src="${escapeHtml(p.image || PLACEHOLDER_DETAIL)}" alt="${escapeHtml(p.title)}" onerror="this.onerror=null; this.src='${PLACEHOLDER_DETAIL}'">
                    </div>
                    <div class="detail-info">
                        <div>
                            <h2 class="text-[24px] tracking-[4px] uppercase mb-[15px]">${escapeHtml(p.title)}</h2>
                            <p class="text-[12px] text-[#aaa] leading-[1.8] tracking-[1px]">${escapeHtml(p.desc)}</p>
                        </div>
                        <div>
                            <p class="text-[20px] text-accent font-mono mb-5">₱${p.price.toLocaleString()}</p>
                            <button class="btn btn-blue" onclick="addToCart(${p.id})">Confirm Add to Cart</button>
                            <button class="btn mt-2.5" data-wish-modal="${p.id}" onclick="toggleWishlist(${p.id})">${wishlistIds.has(p.id) ? '♥ In Wishlist' : '♡ Add to Wishlist'}</button>
                        </div>
                    </div>
                </div>`;
            document.getElementById('productModal').classList.add('active');
        };

        // --- WISHLIST ---
        function paintWishlist(id) {
            const on = wishlistIds.has(id);
            document.querySelectorAll(`[data-wish="${id}"]`).forEach(b => { b.classList.toggle('is-active', on); b.textContent = on ? '♥' : '♡'; });
            document.querySelectorAll(`[data-wish-modal="${id}"]`).forEach(b => { b.textContent = on ? '♥ In Wishlist' : '♡ Add to Wishlist'; });
        }
        window.toggleWishlist = async (id) => {
            playSound();
            const adding = !wishlistIds.has(id);
            adding ? wishlistIds.add(id) : wishlistIds.delete(id);
            paintWishlist(id);
            const { ok } = adding ? await addToWishlist(id) : await removeFromWishlist(id);
            if (!ok) {
                adding ? wishlistIds.delete(id) : wishlistIds.add(id);
                paintWishlist(id);
                toast('Wishlist sync failed. Retry.', 'error');
                return;
            }
            toast(adding ? 'Saved to wishlist' : 'Removed from wishlist');
        };

        // --- MAGNIFYING GLASS LOGIC ---
        window.zoomImage = (e, container) => {
            const img = container.querySelector('img');
            const rect = container.getBoundingClientRect();

            const x = ((e.clientX - rect.left) / rect.width) * 100;
            const y = ((e.clientY - rect.top) / rect.height) * 100;

            img.style.transformOrigin = `${x}% ${y}%`;
            img.style.transform = "scale(2.5)";
        };

        window.resetZoom = (container) => {
            const img = container.querySelector('img');
            img.style.transform = "scale(1)";
            img.style.transformOrigin = "center center";
        };

        // --- CART ---
        window.addToCart = (id) => {
            const p = allProducts.find(x => x.id === id);
            if (!p) return;
            playSound();
            const item = cart.find(i => i.id === id);
            if (item) item.quantity++;
            else cart.push({ id: p.id, name: p.title, price: p.price, quantity: 1 });
            updateCartUI();
        };

        window.increaseQty = (id) => {
            const item = cart.find(i => i.id === id);
            if (item) item.quantity++;
            updateCartUI();
        };

        window.decreaseQty = (id) => {
            const item = cart.find(i => i.id === id);
            if (item && item.quantity > 1) item.quantity--;
            else cart = cart.filter(i => i.id !== id);
            updateCartUI();
        };

        window.removeFromCart = (id) => {
            cart = cart.filter(i => i.id !== id);
            updateCartUI();
        };

        function updateCartUI() {
            const list = document.getElementById('cart-items-list');
            const total = cart.reduce((sum, i) => sum + (i.price * i.quantity), 0);
            const count = cart.reduce((sum, i) => sum + i.quantity, 0);
            saveCart(cart);

            document.getElementById('checkoutTrigger').textContent = `Execute Order (${count})`;
            document.getElementById('total-price').textContent = total.toLocaleString(undefined, { minimumFractionDigits: 2 });

            list.innerHTML = cart.map(i => `
                <div class="checkout-item">
                    <span class="flex-1">${escapeHtml(i.name)}</span>
                    <div class="flex items-center gap-2 mx-[15px]">
                        <button class="qty-btn" onclick="decreaseQty(${i.id})">-</button>
                        <span>${i.quantity}</span>
                        <button class="qty-btn" onclick="increaseQty(${i.id})">+</button>
                    </div>
                    <span class="text-accent w-20 text-right">₱${(i.price * i.quantity).toLocaleString()}</span>
                    <button class="remove-btn" onclick="removeFromCart(${i.id})">X</button>
                </div>
            `).join('') || '<p class="text-center text-[#444] p-5">CART EMPTY</p>';
        }

        // Sends the cart to the server, which prices it from the database and saves the order in Neon.
        const CHECKOUT_ERRORS = {
            product_unavailable: 'ERROR: AN ITEM IS NO LONGER AVAILABLE. REFRESH AND RETRY.',
            not_authenticated: 'ERROR: SESSION EXPIRED. PLEASE LOG IN AGAIN.',
        };
        window.processCheckout = async () => {
            const btn = document.getElementById('confirmCheckoutBtn');
            if (cart.length === 0 || !user || btn.disabled) return;
            const status = document.getElementById('status-msg');
            btn.disabled = true;
            status.innerHTML = "COMMENCING ENCRYPTED UPLOAD...";

            // Keep the original upload animation timing (at least 2s).
            const [result] = await Promise.all([
                placeOrder(cart.map(i => ({ id: i.id, quantity: i.quantity }))),
                new Promise(resolve => setTimeout(resolve, 2000)),
            ]);

            if (result.success) {
                status.innerHTML = `<span class='text-accent'>ORDER #${escapeHtml(result.order.id)} DEPLOYED SUCCESSFULLY. PAYLOAD SAVED.</span>`;
                cart = [];
                updateCartUI();
                setTimeout(() => closeModal('checkoutModal'), 2500);
            } else {
                const message = CHECKOUT_ERRORS[result.error] || 'ERROR: TRANSMISSION FAILED. PLEASE RETRY.';
                status.innerHTML = `<span class='text-danger'>${message}</span>`;
                if (result.error === 'not_authenticated') setTimeout(() => { window.location.href = 'Login.html'; }, 2000);
            }

            btn.disabled = false;
        };

        window.closeModal = (id) => document.getElementById(id).classList.remove('active');
        document.getElementById('checkoutTrigger').addEventListener('click', () => {
            document.getElementById('checkoutModal').classList.add('active');
            document.getElementById('status-msg').innerHTML = "";
        });
        document.getElementById('themeToggleBtn').addEventListener('click', () => {
            document.documentElement.classList.toggle('light-mode');
            localStorage.setItem('paradigm_theme', document.documentElement.classList.contains('light-mode') ? 'light' : 'dark');
        });
        document.getElementById('logoutBtn').addEventListener('click', () => logout());

        if (user) init();
    </script>
</body>
</html>
